<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	template="/WEB-INF/templates/painelManutencaoTecnico.xhtml">

	<ui:param name="tipoPainel" value="PREVENTIVA" />
	<ui:param name="nomeTipoPainel" value="Preventiva" />

	<ui:define name="metadata">
		<f:metadata>
			<f:viewParam name="abrirIniciarId" value="#{painelManutencaoBean.abrirIniciarId}" />
			<f:viewParam name="abrirIniciarTipo" value="#{painelManutencaoBean.abrirIniciarTipo}" />
			<f:viewAction action="#{painelManutencaoBean.setTipoManutencaoParaFiltrar('PREVENTIVA')}" />
			<f:viewAction action="#{painelManutencaoBean.verificarAbrirIniciar()}" />
		</f:metadata>
	</ui:define>

</ui:composition>
